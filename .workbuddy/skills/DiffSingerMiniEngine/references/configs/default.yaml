# DiffSingerMiniEngine 默认配置
# 放置 ONNX 模型文件到 assets/ 对应子目录后，此配置自动生效

model:
  acoustic: "assets/acoustic/acoustic.onnx"
  vocoder: "assets/vocoder/vocoder.onnx"
  rhythmizer: "assets/rhythmizer/rhythmizer.onnx"

inference:
  sample_rate: 44100
  hop_size: 256
  hop_length: 256
  mel_channels: 128
  f0_min: 50
  f0_max: 1100
  device: "cpu"  # cpu / cuda

output:
  format: "wav"
  bit_depth: 16
  normalize: true
